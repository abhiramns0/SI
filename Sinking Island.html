<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sinking Island</title>
<style>
:root{--ink:#27405a;--chip:rgba(255,255,255,.88);--accent:#ff8a5c;--bad:#e5484d;box-sizing:border-box}
:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:#7fd3e6;overflow:hidden;touch-action:none;font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);display:none}
#timer{font-size:clamp(40px,11vw,64px);font-weight:800;text-align:center;line-height:1;color:#fff;text-shadow:0 3px 0 rgba(39,64,90,.35);transition:color .2s}
#timer.hot{color:#ffd1d1;animation:p .5s infinite alternate}
@keyframes p{to{transform:scale(1.14);color:#fff}}
#obj{margin:6px auto 0;width:max-content;max-width:92%;background:var(--chip);border-radius:20px;padding:6px 16px;font-weight:800;font-size:clamp(14px,4vw,18px);text-align:center}
#res{display:flex;gap:8px;justify-content:center;margin-top:8px}
.chip{background:var(--chip);border-radius:16px;padding:5px 14px;font-weight:700;font-size:clamp(13px,3.6vw,16px);text-align:center;line-height:1.15}
.chip b{display:block;font-size:clamp(18px,5vw,24px)}
#bar{margin:8px auto 0;width:min(70%,300px);height:16px;border-radius:9px;background:rgba(255,255,255,.55);overflow:hidden;display:none;border:2px solid #fff}
#bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:44px;height:44px;border:0;border-radius:50%;background:var(--chip);font-size:20px;display:none;pointer-events:auto}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:rgba(127,211,230,.35);backdrop-filter:blur(2px)}
#ov h1{margin:0;font-size:clamp(40px,12vw,76px);line-height:.95;color:#fff;font-weight:800;text-shadow:0 5px 0 var(--ink)}
#ov p{margin:0;font-size:clamp(16px,4.5vw,22px);font-weight:700}
#ov button{margin-top:14px;font:inherit;font-weight:800;font-size:clamp(26px,8vw,40px);padding:12px 54px;border:0;border-radius:40px;background:var(--accent);color:#fff;box-shadow:0 6px 0 #c85a32;cursor:pointer}
#ov button:active{transform:translateY(4px);box-shadow:0 2px 0 #c85a32}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="timer">01:00</div><div id="obj"></div>
<div id="res"><div class="chip">🪵 WOOD<b id="w"></b></div><div class="chip">🍃 LEAVES<b id="l"></b></div></div>
<div id="bar"><i></i></div></div>
<button id="mute" aria-label="Mute">🔊</button>
<div id="ov"><h1 id="t1">SINKING<br>ISLAND</h1><p id="t2">Build. Escape. Survive.</p><button id="go">START</button></div>
<script>
// ===== CONFIG (edit to tune) =====
const CFG={duration:60,islandR:380,endR:40,failR:60,speed:130,woodNeed:8,leavesNeed:5,trees:7,bushes:6,treeAmt:3,bushAmt:2,
collectR:46,buildR:75,buildTime:4,boardR:48,debug:/[?&]debug/.test(location.search)};
// water rise speed = (islandR-endR)/duration (shrinking shore)
const cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,dpr,A;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);A=Math.min(W/950,H/800)}
addEventListener('resize',resize);resize();
// ===== audio =====
let ac,muted=false,amb;
function snd(f,d=.1,type='sine',v=.08,slide=0){if(!ac||muted)return;const o=ac.createOscillator(),x=ac.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,ac.currentTime+d);x.gain.setValueAtTime(v,ac.currentTime);x.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(x).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();const n=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=n;s.loop=true;const f=ac.createLowpassFilter?0:ac.createBiquadFilter();f.type='lowpass';f.frequency.value=380;amb=ac.createGain();amb.gain.value=.05;s.connect(f).connect(amb).connect(ac.destination);s.start()}catch(e){}}
$('mute').onclick=e=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(amb)amb.gain.value=muted?0:.05;e.stopPropagation()};
// ===== state =====
let st='START',el,r,wood,leaves,prog,objs,P,parts,floats,shake,lastSec,tmr,stT,kx=0,ky=0,stepT=0;
const joy={on:false,id:null,bx:0,by:0,x:0,y:0,m:0},cam={x:0,y:0};
const rand=(a,b)=>a+Math.random()*(b-a);
function reset(){
 el=0;r=CFG.islandR;wood=0;leaves=0;prog=0;parts=[];floats=[];shake=0;lastSec=99;tmr=0;stT=0;
 objs=[];
 for(let i=0;i<CFG.trees;i++){const a=i/CFG.trees*6.283+.35,d=215+(i%2)*65;objs.push({k:'tree',x:Math.cos(a)*d,y:Math.sin(a)*d,left:CFG.treeAmt,cd:0,sh:0})}
 for(let i=0;i<CFG.bushes;i++){const a=(i+.5)/CFG.bushes*6.283+.35,d=130+(i%3)*50;objs.push({k:'bush',x:Math.cos(a)*d,y:Math.sin(a)*d,left:CFG.bushAmt,cd:0,sh:0})}
 [[-250,60],[270,-90],[40,-300],[-90,250],[-160,-200]].forEach(p=>objs.push({k:'rock',x:p[0],y:p[1],left:0,sh:0}));
 for(let i=0;i<14;i++){const a=rand(0,6.283),d=rand(100,320);objs.push({k:'flower',x:Math.cos(a)*d,y:Math.sin(a)*d,c:['#ff9ec4','#fff3a0','#c8b6ff'][i%3],left:0,sh:0})}
 P={x:230,y:150,face:1,anim:'idle'};
 cam.x=P.x;cam.y=P.y;
}
function setState(s){st=s;stT=0}
function start(){initAudio();reset();setState('PLAYING');$('ov').style.display='none';$('hud').style.display='block';$('mute').style.display='block'}
function end(win){setState(win?'ESCAPED':'FAILED');snd(win?660:200,.5,'triangle',.12,win?2:.5);
 if(win)for(let i=0;i<40;i++)add(0,0,30,['#ffd84d','#ff8fb1','#8fe3ff'][i%3],1,260);
 setTimeout(()=>{$('t1').innerHTML=win?'ESCAPED!':'THE ISLAND<br>SANK';$('t2').textContent=win?'You survived the sinking island.':"You didn't escape in time.";$('go').textContent=win?'PLAY AGAIN':'TRY AGAIN';$('ov').style.display='flex'},win?900:700)}
$('go').onclick=start;
// ===== input =====
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(CFG.debug)dbg(e.key)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointerdown',e=>{if(joy.on)return;joy.on=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joy.x=joy.y=joy.m=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;const R=Math.min(70,W*.17);let dx=e.clientX-joy.bx,dy=e.clientY-joy.by,l=Math.hypot(dx,dy);if(l>R){joy.bx+=dx/l*(l-R);joy.by+=dy/l*(l-R);dx=dx/l*R;dy=dy/l*R;l=R}
 let m=l/R;m=m<.15?0:(m-.15)/.85;joy.x=l?dx/l:0;joy.y=l?dy/l:0;joy.m=m});
const up=e=>{if(e.pointerId===joy.id){joy.on=false;joy.id=null;joy.m=0}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function dbg(k){if(st==='START')return;if(k==='r')start();if(k==='1'){wood+=8;leaves+=5}if(k==='2'){prog=1;setState('RAFT_READY')}if(k==='3')el=Math.min(el+10,CFG.duration-1);if(k==='4')el=Math.max(0,el-10);if(k==='h')CFG.showR=!CFG.showR}
// ===== fx =====
function add(x,y,z,c,n=6,sp=90){for(let i=0;i<n;i++){const a=rand(0,6.283);parts.push({x,y,z,vx:Math.cos(a)*rand(.3,1)*sp,vy:Math.sin(a)*rand(.3,1)*sp,vz:rand(60,170),c,l:rand(.5,.9),t:0})}}
// ===== update =====
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function update(dt){
 stT+=dt;tmr+=dt;
 parts=parts.filter(p=>(p.t+=dt)<p.l);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=380*dt});
 floats=floats.filter(f=>(f.t+=dt)<.9);
 objs.forEach(o=>{o.sh=Math.max(0,o.sh-dt*3);if(o.cd>0)o.cd-=dt});
 if(st==='START'||st==='ESCAPED'||st==='FAILED'){P.anim=st==='ESCAPED'?'success':st==='FAILED'?'fail':'idle';return}
 el+=dt;r=CFG.islandR-(CFG.islandR-CFG.endR)*Math.min(1,el/CFG.duration);
 shake=el>CFG.duration-10?(el-(CFG.duration-10))/10*2.5:0;
 const rem=Math.max(0,CFG.duration-el),sec=Math.ceil(rem);
 if(sec<=10&&sec!==lastSec&&sec>0){snd(sec<=3?880:660,.12,'square',.05)}lastSec=sec;
 // movement
 let ix=joy.x*joy.m,iy=joy.y*joy.m;
 const kX=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),kY=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 if(kX||kY){const l=Math.hypot(kX,kY);ix=kX/l;iy=kY/l}
 let moving=false,busy=false;
 if(st!=='BOARDED'){
  const m=Math.hypot(ix,iy);
  if(m>0){const vx=(ix+2*iy)/1.414,vy=(2*iy-ix)/1.414;P.x+=vx*CFG.speed*dt;P.y+=vy*CFG.speed*dt;moving=true;if(ix)P.face=ix>0?1:-1;
   stepT+=dt;if(stepT>.28){stepT=0;snd(rand(300,360),.04,'triangle',.02)}}
  const d=Math.hypot(P.x,P.y),mx=r-12;if(d>mx){P.x*=mx/d;P.y*=mx/d}
  // collect
  for(const o of objs){if(!o.left||o.left<=0&&o.k!=='tree'&&o.k!=='bush')continue;if(o.left<=0||(o.k!=='tree'&&o.k!=='bush'))continue;
   if(Math.hypot(o.x,o.y)>r-8)continue;
   if(dist(P,o)<CFG.collectR){busy=true;if(o.cd<=0){o.cd=.4;o.left--;o.sh=1;
    if(o.k==='tree'){wood++;floats.push({x:o.x,y:o.y,z:90,t:0,s:'+1 🪵'});add(o.x,o.y,50,'#9b6b43',6)}else{leaves++;floats.push({x:o.x,y:o.y,z:50,t:0,s:'+1 🍃'});add(o.x,o.y,30,'#6fcf5a',6)}
    snd(o.k==='tree'?420:620,.12,'triangle',.07,1.6)}}}
  // build
  const near=Math.hypot(P.x,P.y)<CFG.buildR;
  if(st==='PLAYING'&&near&&wood>=CFG.woodNeed&&leaves>=CFG.leavesNeed){wood-=CFG.woodNeed;leaves-=CFG.leavesNeed;setState('BUILDING')}
  if(st==='BUILDING'&&near){prog=Math.min(1,prog+dt/CFG.buildTime);busy=true;
   if(Math.random()<dt*14)add(rand(-30,30),rand(-30,30),10,Math.random()<.5?'#e0b070':'#7ddc6a',1,60);
   if(Math.floor(prog*20)!==Math.floor((prog-dt/CFG.buildTime)*20))snd(180+prog*200,.06,'square',.03);
   if(prog>=1){setState('RAFT_READY');snd(523,.4,'triangle',.1,1.5);floats.push({x:0,y:0,z:110,t:0,s:'RAFT COMPLETE'});add(0,0,30,'#fff',24,160)}}
  if(st==='RAFT_READY'&&Math.hypot(P.x,P.y)<CFG.boardR){setState('BOARDED');P.x=0;P.y=0;snd(440,.3,'sine',.1,1.8)}
 }
 P.anim=st==='BOARDED'?'sit':busy&&st==='BUILDING'?'build':busy?'collect':moving?'walk':'idle';
 // outcome
 if(st!=='BOARDED'&&r<=CFG.failR)end(false);
 else if(st==='BOARDED'&&r<=CFG.endR+5)end(true);
 // camera
 cam.x+=(P.x-cam.x)*Math.min(1,dt*5);cam.y+=(P.y-cam.y)*Math.min(1,dt*5);
 // HUD
 const mm=String(Math.floor(rem/60)).padStart(2,'0'),ss=String(Math.floor(rem%60)).padStart(2,'0');
 $('timer').textContent=mm+':'+ss;$('timer').className=rem<=10?'hot':'';
 const sp=st==='BUILDING'||st==='RAFT_READY'||st==='BOARDED';
 $('w').textContent=(sp?Math.round(CFG.woodNeed*(1-prog))+wood:wood)+' / '+CFG.woodNeed;
 $('l').textContent=(sp?Math.round(CFG.leavesNeed*(1-prog))+leaves:leaves)+' / '+CFG.leavesNeed;
 $('obj').textContent={PLAYING:wood+leaves>0?'COLLECT WOOD AND LEAVES':'BUILD A RAFT AND ESCAPE',BUILDING:'BUILD THE RAFT',RAFT_READY:'GET TO THE RAFT',BOARDED:'WAIT FOR ESCAPE'}[st]||'';
 if(st==='PLAYING'&&wood>=CFG.woodNeed&&leaves>=CFG.leavesNeed)$('obj').textContent='GO TO THE CENTER!';
 $('bar').style.display=st==='BUILDING'?'block':'none';$('bar').firstChild.style.width=prog*100+'%';
}
// ===== render =====
let CX,CY,SX=0,SY=0;
const S=(x,y,z=0)=>[CX+((x-y)-(cam.x-cam.y))*A+SX,CY+((x+y)-(cam.x+cam.y))*A/2-z*A+SY];
function ell(x,y,z,rad,fill,sq=1){const[p,q]=S(x,y,z);g.beginPath();g.ellipse(p,q,rad*1.414*A*sq,rad*.707*A*sq,0,0,6.283);g.fillStyle=fill;g.fill()}
function circ(x,y,z,rad,fill){const[p,q]=S(x,y,z);g.beginPath();g.arc(p,q,rad*A,0,6.283);g.fillStyle=fill;g.fill()}
function rrect(x,y,w,h,rad,fill){g.beginPath();g.roundRect(x,y,w,h,rad);g.fillStyle=fill;g.fill()}
function draw(t){
 CX=W/2;CY=H*.5;
 if(shake){SX=rand(-shake,shake);SY=rand(-shake,shake)}else SX=SY=0;
 const sink=1-r/CFG.islandR;
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#8fe0ee');gr.addColorStop(1,'#4fb4d6');g.fillStyle=gr;g.fillRect(0,0,W,H);
 // shallows + ripples
 ell(0,0,-6,r+70,'rgba(190,245,250,.35)');ell(0,0,-6,r+36,'rgba(190,245,250,.5)');
 for(let i=0;i<3;i++){const k=((t/2200+i/3)%1);g.globalAlpha=(1-k)*.6;g.lineWidth=3*A;g.strokeStyle='#fff';const[p,q]=S(0,0,-6);g.beginPath();g.ellipse(p,q,(r+10+k*90)*1.414*A,(r+10+k*90)*.707*A,0,0,6.283);g.stroke()}g.globalAlpha=1;
 for(let i=0;i<8;i++){const a=i*.8+t/4000,d=r+rand(0,0)+120+i*18;const[p,q]=S(Math.cos(a)*d,Math.sin(a)*d,-8);g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2*A;g.beginPath();g.ellipse(p,q,14*A,5*A,0,0,6.283);g.stroke()}
 // island body
 ell(0,0,-22,r*1.0,'#b98a5a');ell(0,0,-10,r,'#b98a5a');ell(0,0,0,r,'#f3dfa5');ell(0,0,3,r*.93,'#8fd46a');ell(0,0,4,r*.78,'#9ddc78');
 // foam
 g.save();g.setLineDash([16*A,10*A]);g.lineDashOffset=-t/60;g.lineWidth=5*A;g.strokeStyle='rgba(255,255,255,.9)';{const[p,q]=S(0,0,0);g.beginPath();g.ellipse(p,q,(r+4)*1.414*A,(r+4)*.707*A,0,0,6.283);g.stroke()}g.restore();
 // build area
 const br=Math.min(CFG.buildR,r*.9);ell(0,0,5,br,'#d8c79a');ell(0,0,5.5,br*.86,'#ebdcb4');
 if(st==='PLAYING'||st==='BUILDING'){g.save();g.setLineDash([8*A,8*A]);g.lineWidth=3*A;g.strokeStyle=st==='BUILDING'?'#ff8a5c':'#fff';const[p,q]=S(0,0,6);g.beginPath();g.ellipse(p,q,br*1.414*A,br*.707*A,0,0,6.283);g.stroke();g.restore()}
 // entities sorted
 const list=objs.filter(o=>Math.hypot(o.x,o.y)<r-4).map(o=>({d:o.x+o.y,f:()=>drawObj(o,t)}));
 list.push({d:0.1,f:()=>drawRaft(t)});list.push({d:P.x+P.y+(st==='BOARDED'?.2:0),f:()=>drawPlayer(t)});
 list.sort((a,b)=>a.d-b.d).forEach(e=>e.f());
 // particles & floats
 parts.forEach(p=>{const[a,b]=S(p.x,p.y,p.z);g.globalAlpha=1-p.t/p.l;g.fillStyle=p.c;g.beginPath();g.arc(a,b,4*A+2,0,6.283);g.fill()});g.globalAlpha=1;
 g.font='800 '+Math.max(16,24*A*1.3)+'px system-ui';g.textAlign='center';
 floats.forEach(f=>{const[a,b]=S(f.x,f.y,f.z+f.t*40);g.globalAlpha=1-f.t/.9;g.lineWidth=4;g.strokeStyle='#27405a';g.strokeText(f.s,a,b);g.fillStyle='#fff';g.fillText(f.s,a,b)});g.globalAlpha=1;
 // debug radii
 if(CFG.debug&&CFG.showR){objs.forEach(o=>{if(o.k==='tree'||o.k==='bush'){const[a,b]=S(o.x,o.y,0);g.strokeStyle='red';g.beginPath();g.ellipse(a,b,CFG.collectR*1.414*A,CFG.collectR*.707*A,0,0,6.283);g.stroke()}})}
 // danger vignette
 if(st!=='START'&&el>CFG.duration-10){const k=(el-(CFG.duration-10))/10;const v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(229,72,77,0)');v.addColorStop(1,'rgba(229,72,77,'+(.15+.3*k)*(.7+.3*Math.sin(t/120))+')');g.fillStyle=v;g.fillRect(0,0,W,H)}
 // joystick
 if(st!=='START'&&st!=='ESCAPED'&&st!=='FAILED'&&st!=='BOARDED'){const R=Math.min(70,W*.17);let bx=joy.bx,by=joy.by,a=.5;if(!joy.on){bx=W*.5;by=H-Math.max(90,H*.13)-(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sb'))||0);a=.28}
  g.globalAlpha=a;g.fillStyle='#fff';g.beginPath();g.arc(bx,by,R,0,6.283);g.fill();g.globalAlpha=a+.2;g.fillStyle='#27405a';g.beginPath();g.arc(bx+joy.x*joy.m*R,by+joy.y*joy.m*R,R*.42,0,6.283);g.fill();g.globalAlpha=1}
}
function drawObj(o,t){
 const w=Math.sin(o.sh*12)*o.sh*4,[x,y]=S(o.x,o.y,0);
 ell(o.x,o.y,5,o.k==='tree'?22:o.k==='bush'?20:14,'rgba(40,80,40,.25)');
 if(o.k==='tree'){
  if(o.left>0){const s=.6+o.left/CFG.treeAmt*.4;rrect(x-6*A,y-44*A,12*A,44*A,5*A,'#8a5a36');
   [[0,-64,30,'#58c26a'],[-4,-84,25,'#6fd47c'],[3,-100,17,'#8be08e']].forEach(c=>{g.beginPath();g.arc(x+(c[0]+w)*A,y+c[1]*A*(.7+.3*s),c[2]*A*s,0,6.283);g.fillStyle=c[3];g.fill()})}
  else{rrect(x-9*A,y-12*A,18*A,14*A,5*A,'#8a5a36');g.beginPath();g.ellipse(x,y-12*A,9*A,4*A,0,0,6.283);g.fillStyle='#d8aa72';g.fill()}
 }else if(o.k==='bush'){
  const s=o.left>0?1:.45,c=o.left>0?['#4fbf62','#68d278']:['#9bbf86','#a9cd95'];
  g.beginPath();g.arc(x-11*A*s+w*A,y-13*A*s,15*A*s,0,6.283);g.fillStyle=c[0];g.fill();g.beginPath();g.arc(x+11*A*s+w*A,y-13*A*s,15*A*s,0,6.283);g.fill();g.beginPath();g.arc(x+w*A,y-22*A*s,17*A*s,0,6.283);g.fillStyle=c[1];g.fill();
  if(o.left>0){g.fillStyle='#ff7a8c';[[-8,-24],[7,-18],[0,-30]].forEach(b=>{g.beginPath();g.arc(x+b[0]*A,y+b[1]*A,3*A,0,6.283);g.fill()})}
